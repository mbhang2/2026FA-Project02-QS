# Run configuration. Immutable, for the same reason the scorer is.
#
# Whoever chooses the split, the fill model and the seed can point a run at the
# holdout, select favorable fills, or retry until a lucky seed lands. None of
# those require touching the scorer and all three are cheaper ways to fake a
# result. This file is the only place they are set; nothing reads them from the
# strategy or from arguments the agent controls.

profiles:

  # What the loop harness runs.
  harness:
    dataset: synthetic
    split: validation
    fill_model: unfavorable        # the loop scores on the pessimistic model
    seed: 1
    warmup_sessions: 1
    wall_clock_budget_s: 900
    notional_base: 1.0

  # What the agent may run itself, so it can execute what it writes rather than
  # shipping syntax errors into the loop. Fixed: validation only, no arguments
  # that change any of it, holdout unreachable. Every invocation still emits a
  # ledger record.
  # Synthetic, fitted, and fast. `tests/test_run_end_to_end.py` runs `run.py`
  # through this to assemble a real ledger row -- the one thing the rest of the
  # suite never does, and the reason three wiring bugs reached a live run.
  harness-fitted:
    dataset: synthetic
    split: train
    fill_model: unfavorable
    seed: 1
    warmup_sessions: 1
    fit_sessions: 20
    notional_base: 1.0
    commission_per_contract: 0.10

  # The load half of the fitted path, on synthetic data. `weights_path` is a
  # fixed file the end-to-end test writes before running; the engine refuses to
  # start if it is absent, which is the point. No fit_sessions: a run either
  # fits or loads.
  harness-fitted-load:
    dataset: synthetic
    split: validation
    fill_model: unfavorable
    seed: 1
    warmup_sessions: 1
    weights_path: .scratch/test-weights/harness-fitted-load.weights
    notional_base: 1.0
    commission_per_contract: 0.10

  agent:
    dataset: synthetic-check
    split: validation
    fill_model: unfavorable
    seed: 1
    warmup_sessions: 1
    wall_clock_budget_s: 120
    notional_base: 1.0

  # What a campaign searches on. **Training split only**, which is the point:
  # the loop proposes and discards on train, and validation is a budget spent
  # later by a promotion rule that does not exist yet (Task 31). A campaign that
  # searched on validation would consume the split it is eventually judged
  # against, which is the same mistake as scoring on the holdout with extra
  # steps.
  #
  # 105 synthetic training sessions at signal_strength 0.0 -- no edge to find,
  # which is exactly what the correction is calibrated against.
  campaign:
    dataset: synthetic
    split: train
    fill_model: unfavorable
    seed: 1
    warmup_sessions: 0
    wall_clock_budget_s: 120
    notional_base: 1.0
    action_cap: 64
    history_window: 512

  # Task 37's positive control. The same campaign profile in every respect --
  # train split, unfavorable fills, seed 1, same caps and budgets -- with a
  # planted signal of known strength and nothing else changed. Two strengths,
  # both sized before the campaigns ran against the gate's own bar (the Task 36
  # best-of-100 null maximum, +0.8011 at q = 0.05):
  #
  #   0.30  the calibration reference scores +0.7708 here: a plausible strategy
  #         lands *on* the bar, so clearing it takes a candidate better than the
  #         apparatus. The perfect-knowledge oracle scores +9.8190.
  #   0.50  the reference scores +2.8810, 3.6x the bar. Oracle +38.2458.
  #
  # `docs/reviews/task37/sweep.json` is the measurement. The agent is never told
  # a signal exists, and the prompt template digest is asserted identical to
  # Task 36's in the campaign record -- otherwise this measures whether a model
  # can implement a described rule, which is not the question.
  campaign-s030:
    dataset: synthetic-s030
    split: train
    fill_model: unfavorable
    seed: 1
    warmup_sessions: 0
    wall_clock_budget_s: 120
    notional_base: 1.0
    action_cap: 64
    history_window: 512

  campaign-s050:
    dataset: synthetic-s050
    split: train
    fill_model: unfavorable
    seed: 1
    warmup_sessions: 0
    wall_clock_budget_s: 120
    notional_base: 1.0
    action_cap: 64
    history_window: 512

  # The holdout. A profile rather than a flag: since Task 20 the split is not a
  # command-line argument, so pointing a run at the holdout is an edit to a
  # committed file rather than something anyone can type. It still refuses to
  # run without --unlock-holdout and a reason, and --human on top of that.
  holdout:
    dataset: synthetic
    split: holdout
    fill_model: unfavorable
    seed: 1
    warmup_sessions: 1
    wall_clock_budget_s: 900
    notional_base: 1.0

  # NQ TRAINING SPLIT. The split the loop is meant to hammer -- the calendar
  # says so: "the loop scores here repeatedly and this split is expected to be
  # overfit by selection, that is what the holdout is for."
  #
  # `commission_per_contract: 0.10` is the cost decision, and it is per SIDE.
  # NQ is $20 per index point; $4.00 round turn is $2.00 a side, which is
  # 0.10 points. The figure is Michael's live round turn on this contract, not
  # an estimate. The engine charges `commission_per_contract * fill.size` on
  # every fill, and a round trip is two fills -- putting 0.25 here would
  # double-charge. The engine default of 0.01 is scaled for the synthetic
  # generator's price units and is 6-12x too cheap on NQ, which would subsidise
  # exactly the high-turnover strategies a search drifts toward.
  #
  # Added in Task 54 to MEASURE per-trial cost. A scored campaign against this
  # profile is governed by the pre-registration, not by this file existing.
  # USABLE since 2026-09-22. It was not: run.py hands the engine a RemoteStrategy
  # proxy that forwarded none of fit()/save_weights()/load_weights(), and this
  # profile died with "RemoteStrategy is not a fitted strategy". Closed by
  # RemoteFittedStrategy -- docs/design/ml-strategies.md section 11, "The way
  # through". Smoked against real NQ the same day: 284 sessions fitted, 100
  # scored, threshold 160.0 contracts of delta, weights written and digested.
  #
  # A fitted-strategy profile: the first 284 train sessions are the fit window
  # (bars delivered, actions ignored, excluded from the score) and the last 100
  # are scored. S = 100 is pre-registered -- see docs/design/ml-strategies.md --
  # rather than chosen per campaign, because a scored-window length picked per
  # campaign is a tunable that shapes results.
  nq-train-fitted:
    dataset: nq
    split: train
    fill_model: unfavorable
    seed: 1
    warmup_sessions: 1
    fit_sessions: 284
    wall_clock_budget_s: 7200
    notional_base: 1.0
    commission_per_contract: 0.10
    record_fill_spread: false

  nq-train:
    dataset: nq
    split: train
    fill_model: unfavorable
    seed: 1
    warmup_sessions: 1
    wall_clock_budget_s: 7200
    notional_base: 1.0
    commission_per_contract: 0.10
    record_fill_spread: false

  # The first real end-to-end run: reference strategy, real NQ data, the
  # pre-registered validation split. A plumbing check at full scale, not a
  # result -- run it with `--purpose smoke`.
  # Same as `nq-validation` in every evaluation condition, plus the weights the
  # champion fitted. A separate profile rather than a key on `nq-validation`
  # because the engine treats a `weights_path` that does not exist as an error
  # -- correctly, since a missing file is not a licence to refit on the
  # validation split -- so the plain profile cannot carry the key unconditionally.
  #
  # `weights_path` and `fit_sessions` are mutually exclusive: a run either fits
  # or loads. This one loads, which is the entire point. See Amendment 4.
  nq-validation-fitted:
    dataset: nq
    split: validation
    fill_model: unfavorable
    seed: 1
    warmup_sessions: 1
    wall_clock_budget_s: 3600
    notional_base: 1.0
    commission_per_contract: 0.10
    record_fill_spread: false
    weights_path: runs/current.weights

  nq-validation:
    dataset: nq
    split: validation
    fill_model: unfavorable
    seed: 1
    warmup_sessions: 1
    wall_clock_budget_s: 3600
    notional_base: 1.0
    # Must match nq-train. The protocol runs a campaign's winner on validation
    # and compares the two numbers; costed at different rates they are not
    # comparable, and the cheaper split would look like the better one. This key
    # was absent until Task 61, which meant validation silently charged the
    # engine default of 0.01 against train's 0.10 -- the Task 60 bug again, in
    # the one place where the difference would have been read as a result.
    commission_per_contract: 0.10
    record_fill_spread: false

# Dataset definitions the profiles name.
datasets:
  synthetic:
    kind: synthetic
    n_sessions: 175
    ticks_per_session: 390
    vol_per_tick: 0.15
    signal_strength: 0.0

  # Deliberately small. The agent's check answers "does this code run", and a
  # check that walked the whole validation split would be an evaluation with the
  # number withheld rather than a check.
  synthetic-check:
    kind: synthetic
    n_sessions: 40
    ticks_per_session: 390
    vol_per_tick: 0.15
    signal_strength: 0.0

  synthetic-signal:
    kind: synthetic
    n_sessions: 175
    ticks_per_session: 390
    vol_per_tick: 0.15
    signal_strength: 0.5

  # Task 37. Identical to `synthetic` but for `signal_strength`. The planted
  # edge is momentum over consecutive 10-tick blocks, and ticks are 30s apart,
  # so a block is exactly one 5m bar -- the interval every worked example in
  # `strategy-api.md` uses. That is what makes it reachable by the kind of code
  # a model actually writes, and it is a property of the generator rather than
  # a choice made to flatter the result.
  synthetic-s030:
    kind: synthetic
    n_sessions: 175
    ticks_per_session: 390
    vol_per_tick: 0.15
    signal_strength: 0.30

  synthetic-s050:
    kind: synthetic
    n_sessions: 175
    ticks_per_session: 390
    vol_per_tick: 0.15
    signal_strength: 0.50

  # Real data. `commission_per_contract` is deliberately absent: the engine's
  # default is scaled for the synthetic generator's price units and a real NQ
  # cost model is its own decision, not something to slip in here.
  nq:
    kind: nq
    symbol: NQ

# Campaign-level settings. Pre-registered by `docs/design/pre-registration.md`;
# the values here are copied into `CampaignRecord` and hashed before trial 0, so
# a budget edited mid-campaign fails the record's own digest check. This file is
# where they are written; the hashed record is where they are committed.
campaign:
  n_trials: 50

  # May the proposing agent write a strategy that FITS -- one whose parameters
  # come from the data rather than from whoever wrote it?
  #
  # `true` since 2026-09-23. A fitted proposal is refused before `current.py`
  # is touched and before `run.py` runs, so when this is off one never reaches
  # the data and never counts toward N.
  #
  # **Permission, not instruction, and only meaningful where the profile can
  # honour it.** What gets frozen into `campaign.json` is this AND the profile's
  # fit window: a campaign registered against a profile with `fit_sessions: 0`
  # records `false` however this is set, because a fitted proposal there would
  # pass this gate and then be refused by the engine for having no window to fit
  # in -- a wasted trial rather than a useful refusal.
  #
  # What this does NOT control, because the architecture already does: the agent
  # cannot move the fit window. `fit_sessions` lives in a profile, profiles live
  # in this file, and `scripts/check_agent_paths.py` allows the agent to write
  # only `src/strategies/`. The one knob where a bad choice produces a
  # FLATTERING score rather than a bad one is out of its reach structurally,
  # which is why this flag can be a simple yes/no.
  #
  # Frozen into `campaign.json` before trial 0. Turning it on partway through
  # because the unfitted trials looked poor is a different experiment from the
  # one that was registered.
  allow_fitted_proposals: true

  # Amendment 6. A candidate is scoreable only if it was exposed in at least
  # this fraction of its scored sessions; below it, `rejected` the way
  # MIN_SESSIONS already rejects -- never seen by the correction. Task 69
  # measured why: idle sessions pad Sortino's denominator by sqrt(N/exposed),
  # 2.67x at 14 of 100 and 1.20x at 70 of 100. Frozen into campaign.json at
  # registration; `--min-exposed` overrides it there for a hypothesis that is
  # genuinely rare (0.05) or genuinely daily (0.90). The floor never applies
  # inside a null.
  min_exposed_fraction: 0.70

  # TWO AXES, not one. `max_of_n` is a correction; `round_turn_mc` is a null
  # source. See pre-registration.md 3a -- including which combinations are
  # coherent, and the fact that the measured FWER of 0.060 describes the PAIR
  # (conditional + max_of_n) rather than either setting alone.
  #
  # null_source: where a candidate's null comes from
  #   conditional     rotation/bucket at R=150. Per-candidate. ~15h per campaign.
  #   round_turn_mc   sign-flip the candidate's round turns, B=10,000. Seconds.
  #                   Exact method in pre-registration.md 3b -- "Monte Carlo over
  #                   round turns" is not one method and the ambiguity would be a
  #                   free parameter.
  #   tabulated       the committed empirical null table. Free, NOT per-candidate.
  #   none            no null is built.
  null_source: round_turn_mc

  # correction: how N candidates become one decision
  #   max_of_n        distribution of the best-of-N. Needs a per-candidate source.
  #   step_down_max   Westfall-Young. Needs a per-candidate source.
  #   bh / holm       need p-values. Demoted to diagnostics in Task 32, and
  #                   resolvable only while N <= q(R+1) -- N <= 100 at R=2000.
  #   haircut_sharpe  Harvey-Liu. NOT BUILT.
  #   dsr             Bailey & Lopez de Prado. Biased high +0.017..+0.036 (Task 42).
  #   none            read the metrics.
  correction: max_of_n

  q: 0.05

  # Pre-registration Amendment 3. Index points charged against a session in which
  # no position was held, pro-rated by the fraction of the session that WAS held.
  # A cost of capital: ~$20,000 of initial margin at ~4.5% over 252 days at $20 a
  # point. It exists because MAR = 0 over the full calendar made sitting out
  # profitable for a losing strategy -- sortino goes as 1/sqrt(n), so flat
  # sessions drag a negative score toward zero and the agent learns to stop
  # trading. nq-mvp-01 ended on 3 trades in 384 sessions; nq-orderflow-01 on 8.
  #
  # Derived, never fitted. Set 0.0 to score the way the first two campaigns were
  # scored -- which is the ONLY comparison it should be used for, since nothing
  # after this amendment is comparable to anything before it.
  idle_charge: 0.18

ledger: runs/ledger.jsonl
