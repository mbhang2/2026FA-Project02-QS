schema: constraints/1
hypothesis: flow-continuation.md
clock: America/Chicago
constraints:
  - id: uses-signed-flow
    says: "measure how much volume traded on the offer against how much traded on the bid. That difference is signed order flow"
    check: code_uses
    any_of: [delta, buy_volume, sell_volume, Side, side]

judged:
  - id: not-a-fade
    says: "A strategy that fades large flow is testing the opposite claim and is not an implementation of this one."
  - id: unknown-not-folded
    says: "Do not fold them into one side to make the arithmetic tidy."
  - id: not-regime-model
    says: "Not a regime model."

