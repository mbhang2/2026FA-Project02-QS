# Provenance for the replacement download. The vendor sidecars that carried this
# lived at patches/_jobs/GLBX-20260908-MRU3SPA6VW/ and were purged with the rest
# of the prefix, so the fields below are transcribed from them here.
job_provenance:
  GLBX-20260908-MRU3SPA6VW:
    dataset: GLBX.MDP3
    schema: trades
    symbols: [NQ.FUT]
    stype_in: parent
    stype_out: instrument_id
    encoding: dbn
    compression: zstd
    split_duration: day
    query_start_ns: 1751500800000000000   # 2025-07-03T00:00:00Z
    query_end_ns: 1752105600000000000     # 2025-07-10T00:00:00Z
    submitted: 2026-09-08
    dbn_version: 3
    sidecars_purged_from: patches/_jobs/GLBX-20260908-MRU3SPA6VW/
    note: >
      The replacements are DBN v3 while the rest of the mirror is DBN v1. Both
      decode to the same 13 columns and dtypes with a ts_recv index, so the
      difference is invisible above the reader. The v1/v3 mix now lives inside
      raw/ and is permanent, so dbn_version is recorded per object in
      data/manifest.json.
