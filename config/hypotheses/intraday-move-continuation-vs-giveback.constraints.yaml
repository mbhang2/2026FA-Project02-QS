schema: constraints/1
hypothesis: intraday-move-continuation-vs-giveback.md
clock: America/Chicago
constraints:
  - id: within-one-session
    says: "Within a single trading session, after price has made a move that is large relative to how that session has been moving so far, what happens over the rest of the session?"
    check: no_overnight

judged:
  - id: large-relative-to-session
    says: "has to be measured against something the session itself supplies"
  - id: one-mechanism-across-hours
    says: "A strategy that is long in hour 17, short in hour 18, and long again in hour 19 is not expressing a view about continuation or give-back."
  - id: not-regime-model
    says: "Not a regime model that switches between the two accounts."

# not mechanically checkable, and not decidable from the code alone:
# - "or restrict itself to the hours where the mechanism is claimed to operate, and say why those hours" -- the why lives in prose, which the reviewer does not see
# - "The strategy should not be one that only makes money in a few months." -- an outcome
# - "Not a fast-execution idea." -- an outcome; no hold bound is stated
