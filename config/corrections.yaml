# Historical corrections record.
#
# This file is EVIDENCE, not a mechanism. Nothing reads it at runtime and no path
# resolution happens anywhere: the bucket holds exactly one object per (symbol,
# date) under raw/, and that object is canonical. It replaced
# config/exclusions.yaml, which described a supersession scheme that no longer
# exists.
#
# WHAT HAPPENED
#
# Task 1 (commit f40c3c3) found six objects under raw/trades/NQ/ whose DBN header
# reported ES.FUT and whose decompressed bytes were identical to the
# raw/trades/ES/ object of the same date. NQ had no data at all on those dates.
# Correct NQ data was re-downloaded from Databento (job
# GLBX-20260908-MRU3SPA6VW) and, on 2026-09-08, copied over the contaminated
# objects in place. The patches/ prefix that briefly held the replacements was
# then purged.
#
# DIVERGENCE FROM THE SOURCE LAKE
#
# raw/ is no longer byte-identical to gexalgo/raw. It differs on exactly the six
# objects listed below and on nothing else. The contaminated originals still
# exist in gexalgo/raw, so nothing here is unrecoverable. Because the in-place
# overwrite gave up `rclone check` as a mirror-integrity test, data/manifest.json
# now carries size and ETag for every object and scripts/inventory.py compares
# them on every run.
#
# The `original.sha256` fields are null: Task 1b hashed only the replacements, and
# the contaminated bytes were overwritten before a digest was taken. The size,
# DBN version and header symbol below come from data/manifest.json at commit
# 601f1f3, which was generated from the bucket while the originals were still in
# place. A digest can be recovered from gexalgo/raw if one is ever needed.

divergence_from_source_lake:
  source: gexalgo/raw
  objects_differing: 6
  applied: 2026-09-08
  method: in-place overwrite; the patches/ prefix that held the replacements was purged
  originals_recoverable_from: gexalgo/raw

